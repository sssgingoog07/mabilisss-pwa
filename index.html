<style>
/* ════════════════════════════════════════════════════════════════════
   SSS HOUSE STYLE — tokens matched exactly to kiosk/consoles family.
   This is a government trust product: consistency IS the design.
   ════════════════════════════════════════════════════════════════════ */
:root{
  --sss-blue:#003876; --sss-blue-d:#002852; --sss-blue-l:#1d5fa0; --sss-blue-soft:#e6ecf3;
  --teal:#00847d; --teal-d:#006963; --teal-soft:#e0f2f0;
  --bg:#f4f6fa; --surface:#ffffff; --text:#0f1a2e; --text-muted:#5a6b85;
  --border:#d8dee9; --radius:12px; --radius-lg:18px; --radius-sm:8px;
  --ok:#22c55e; --ok-d:#16a34a; --warn:#f59e0b; --warn-d:#d97706; --err:#dc2626;
  --shadow:0 2px 12px rgba(0,40,82,.08); --shadow-lg:0 6px 24px rgba(0,40,82,.14);
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.5;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
.app{max-width:480px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; position:relative;}

/* ── App bar (gradient, the house header) ── */
.appbar{
  background:linear-gradient(135deg,var(--sss-blue-d),var(--sss-blue) 55%,var(--sss-blue-l));
  color:#fff; padding:calc(var(--safe-top) + 14px) 18px 16px; position:sticky; top:0; z-index:20;
  box-shadow:0 2px 10px rgba(0,40,82,.25);
}
.appbar-row{display:flex; align-items:center; gap:12px;}
.appbar-logo{
  width:44px;height:44px;border-radius:10px;flex:0 0 auto;
  background:#fff; display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.18); padding:3px;
}
.appbar-logo img{width:100%;height:100%;object-fit:contain;display:block;}
.appbar-title{font-size:18px;font-weight:800;letter-spacing:.2px;line-height:1.15;}
.appbar-sub{font-size:12px;opacity:.85;font-weight:500;margin-top:1px;}

/* ── Scroll body ── */
.screen{flex:1; padding:16px; padding-bottom:calc(24px + var(--safe-bot)); animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ── Cards ── */
.card{background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:14px;}
.card-tight{padding:12px 14px;}

/* ── Status pill (branch open/closed/offline) ── */
.status-banner{
  display:flex;align-items:center;gap:10px;border-radius:var(--radius);
  padding:12px 14px;margin-bottom:14px;font-weight:600;font-size:14px;
}
.status-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 3px rgba(255,255,255,.5);}
.st-open  {background:rgba(34,197,94,.12); color:var(--ok-d);}
.st-open   .status-dot{background:var(--ok);}
.st-closed{background:rgba(128,128,128,.12); color:var(--text-muted);}
.st-closed .status-dot{background:#9ca3af;}
.st-offline{background:rgba(245,158,11,.12); color:var(--warn-d);}
.st-offline .status-dot{background:var(--warn);}
.st-holiday{background:rgba(245,158,11,.12); color:var(--warn-d);}
.st-holiday .status-dot{background:var(--warn);}
.st-intermittent{background:rgba(234,179,8,.14); color:#a16207;}
.st-intermittent .status-dot{background:#eab308;}

/* ── Hours line ── */
.hours-line{text-align:center;font-size:13px;color:var(--text-muted);background:var(--sss-blue-soft);
  border-radius:var(--radius-sm);padding:9px 12px;margin-bottom:14px;font-weight:600;}
.hours-line b{color:var(--sss-blue);}

/* ── Announcement ── */
.announce{background:var(--teal-soft);border-left:4px solid var(--teal);border-radius:var(--radius-sm);
  padding:11px 13px;margin-bottom:14px;font-size:13px;color:var(--teal-d);font-weight:500;}

/* ── Live queue counts ── */
.counts{display:flex;gap:12px;margin-bottom:16px;}
.count{flex:1;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px 10px;text-align:center;}
.count .val{font-size:30px;font-weight:900;line-height:1;}
.count .lbl{font-size:11.5px;color:var(--text-muted);margin-top:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}

/* ── Primary action buttons ── */
.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  border:none;border-radius:var(--radius);padding:16px;font-size:16px;font-weight:700;
  cursor:pointer;transition:transform .08s ease, box-shadow .15s ease, opacity .15s ease;
  font-family:inherit;
}
.btn:active{transform:scale(.985);}
.btn-primary{background:linear-gradient(135deg,var(--sss-blue),var(--sss-blue-l));color:#fff;box-shadow:var(--shadow-lg);margin-bottom:12px;}
.btn-secondary{background:var(--surface);color:var(--sss-blue);border:2px solid var(--sss-blue-soft);box-shadow:var(--shadow);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-sub{font-size:12px;font-weight:500;opacity:.85;display:block;margin-top:2px;}

/* ── "How it works" steps ── */
.how{margin-top:4px;}
.how-title{font-size:13px;font-weight:800;color:var(--sss-blue);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;}
.how-step{display:flex;gap:11px;margin-bottom:11px;font-size:13.5px;color:var(--text-muted);}
.how-num{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--sss-blue-soft);color:var(--sss-blue);
  font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;}
.how-step b{color:var(--text);font-weight:700;}

/* ── Reservation-window note ── */
.note{font-size:12.5px;border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:12px;font-weight:500;}
.note-yellow{background:rgba(245,158,11,.1);color:var(--warn-d);}
.note-blue{background:rgba(0,56,118,.06);color:var(--sss-blue);}

/* ── Footer ── */
.foot{text-align:center;font-size:11px;color:var(--text-muted);padding:14px 16px calc(20px + var(--safe-bot));opacity:.75;}
.foot b{color:var(--sss-blue);}

/* ── Loading / error states ── */
.loading{text-align:center;padding:40px 20px;color:var(--text-muted);}
.spinner{width:36px;height:36px;border:3px solid var(--sss-blue-soft);border-top-color:var(--sss-blue);
  border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.errbox{background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.25);border-radius:var(--radius);
  padding:16px;color:var(--err);font-size:14px;text-align:center;}

/* placeholder badge for phase-2/3 routes */
.soon{display:inline-block;background:var(--sss-blue-soft);color:var(--sss-blue);font-size:11px;
  font-weight:700;padding:3px 9px;border-radius:20px;margin-top:8px;}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

/* ════ Phase 2 — reservation flow ════ */
.flow-step{font-size:13px;font-weight:800;color:var(--sss-blue);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:14px;}

/* selectable list buttons (category/service/timeslot) */
.cat-btn,.svc-btn,.ts-btn{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);
  padding:15px 14px;margin-bottom:11px;cursor:pointer;font-family:inherit;
  transition:border-color .12s ease, box-shadow .12s ease, transform .08s ease;
  box-shadow:var(--shadow);
}
.cat-btn:active,.svc-btn:active,.ts-btn:active{transform:scale(.99);}
.cat-btn:not(.full):hover,.svc-btn:hover,.ts-btn:not(.full):hover{border-color:var(--sss-blue-l);box-shadow:var(--shadow-lg);}
.cat-btn.full,.ts-btn.full{opacity:.5;cursor:not-allowed;}
.cat-icon{font-size:26px;flex:0 0 auto;width:34px;text-align:center;}
.cat-body{flex:1;display:flex;flex-direction:column;gap:2px;}
.cat-label{font-size:16px;font-weight:700;color:var(--text);}
.cat-desc{font-size:12px;color:var(--text-muted);line-height:1.35;}
.cat-rem{flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--teal-d);background:var(--teal-soft);
  padding:4px 9px;border-radius:20px;}
.cat-btn.full .cat-rem{color:var(--text-muted);background:rgba(128,128,128,.12);}
.svc-dot{color:var(--sss-blue-l);font-size:13px;flex:0 0 auto;}
.svc-label{font-size:15px;font-weight:600;color:var(--text);display:block;}
.svc-desc{font-size:12px;color:var(--text-muted);display:block;margin-top:2px;}
.ts-btn{justify-content:space-between;font-size:15px;font-weight:600;color:var(--text);}
.ts-state{font-size:11.5px;font-weight:700;color:var(--teal-d);background:var(--teal-soft);padding:4px 9px;border-radius:20px;}
.ts-btn.full .ts-state{color:var(--text-muted);background:rgba(128,128,128,.12);}

/* "What this covers" — info-only expandable on category */
.cat-wrap{margin-bottom:11px;}
.cat-wrap .cat-btn{margin-bottom:0;}
.cat-covers-toggle{

}
.cat-covers-toggle .chev{transition:transform .15s ease;display:inline-block;}
.cat-covers-toggle.open .chev{transform:rotate(180deg);}
.cat-covers{
  background:var(--sss-blue-soft);border-radius:0 0 var(--radius) var(--radius);

}
.covers-intro{font-size:12px;font-weight:700;color:var(--sss-blue);margin-bottom:7px;}
.covers-list{list-style:none;margin:0;padding:0;}
.covers-list li{font-size:13px;color:var(--text);padding:4px 0 4px 16px;position:relative;line-height:1.4;}
.covers-list li:before{content:"•";position:absolute;left:3px;color:var(--teal);font-weight:900;}
.covers-desc{color:var(--text-muted);font-size:12px;}

/* confirm summary rows */
.sum-row{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:8px 0;border-bottom:1px solid var(--sss-blue-soft);font-size:14px;color:var(--text-muted);}

/* priority block */
.pri-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px;}
.pri-opts{display:flex;gap:10px;margin-bottom:6px;}
.pri-opt{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:11px;cursor:pointer;
  font-size:14px;font-weight:600;}

.pri-warn{background:rgba(245,158,11,.1);color:var(--warn-d);border-radius:var(--radius-sm);
  padding:11px 12px;font-size:12.5px;line-height:1.5;margin:10px 0;}
.consent{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--text);line-height:1.45;cursor:pointer;}
.consent input{margin-top:2px;accent-color:var(--sss-blue);flex:0 0 auto;}

/* inline message */

/* ticket */

.ticket-top{font-size:14px;font-weight:800;color:var(--ok-d);letter-spacing:.5px;}

.ticket-qr img{border-radius:var(--radius-sm);border:1px solid var(--border);padding:6px;background:#fff;}

/* ════ Phase 3 — track flow ════ */
.track-tabs{display:flex;gap:8px;margin-bottom:12px;}
.track-tab{flex:1;padding:10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);font-family:inherit;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;}
.track-tab.active{border-color:var(--sss-blue);color:var(--sss-blue);background:var(--sss-blue-soft);}
.track-input{width:100%;padding:14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  font-size:18px;font-family:inherit;text-align:center;letter-spacing:1px;margin-bottom:10px;color:var(--text);}
.track-input:focus{outline:none;border-color:var(--sss-blue);}

.tk-banner{border-radius:var(--radius);padding:18px;margin-bottom:14px;text-align:center;color:#fff;font-size:13px;font-weight:700;letter-spacing:1px;line-height:1.5;}

.tk-banner.srv{background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 4px 16px rgba(34,197,94,.35);}
.tk-banner.passed{background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 4px 16px rgba(245,158,11,.35);}
.tk-banner.done{background:linear-gradient(135deg,#16a34a,#15803d);}

.tk-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 18px;text-align:center;margin-bottom:14px;border-top:4px solid var(--sss-blue-l);}
.tk-num{font-size:46px;font-weight:900;color:var(--sss-blue);letter-spacing:2px;line-height:1;font-variant-numeric:tabular-nums;}
.tk-num-label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-top:6px;}
.tk-ahead{margin-top:18px;padding-top:16px;border-top:1px solid var(--sss-blue-soft);}
.tk-ahead-val{font-size:30px;font-weight:900;line-height:1;}
.tk-ahead-lbl{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;margin-top:5px;}
.tk-slot{margin-top:14px;font-size:13px;color:var(--text-muted);}
.tk-autonote{text-align:center;font-size:11px;color:var(--text-muted);margin-top:10px;opacity:.7;}

/* CSAT */
.csat{margin-top:14px;}
.csat-title{font-size:16px;font-weight:800;color:var(--sss-blue);text-align:center;margin-bottom:14px;}
.csat-q{font-size:13px;font-weight:700;color:var(--text);margin:14px 0 8px;}
.csat-row{display:flex;gap:7px;}
.csat-row-wrap{flex-wrap:wrap;}
.csat-opt{flex:1;min-width:0;padding:10px 6px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);font-family:inherit;font-size:13px;cursor:pointer;color:var(--text);transition:border-color .1s,background .1s;}
.csat-opt-text{flex:initial;font-size:12px;font-weight:600;}
.csat-opt .csat-emo{font-size:24px;}
.csat-opt.sel{border-color:var(--sss-blue);background:var(--sss-blue-soft);color:var(--sss-blue);font-weight:700;}
.csat-comment{width:100%;margin-top:14px;padding:11px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  font-family:inherit;font-size:14px;resize:vertical;min-height:64px;color:var(--text);}
.csat-comment:focus{outline:none;border-color:var(--sss-blue);}
.csat .btn{margin-top:14px;}

</style>

<body>
<div class="app" id="app">

  <!-- App bar -->
  <header class="appbar">
    <div class="appbar-row">
      <div class="appbar-logo" id="appLogo">
        <img id="sssLogoImg" alt="SSS" />
      </div>
      <div>
        <div class="appbar-title">MabiliSSS eQueue</div>
        <div class="appbar-sub" id="branchName">Loading…</div>
      </div>
    </div>
  </header>

  <!-- Screen container — Phase 1 renders Home here -->
  <main class="screen" id="screen">
    <div class="loading">
      <div class="spinner"></div>
      <div>Connecting to your branch…</div>
    </div>
  </main>

  <footer class="foot">
    No personal details collected — your identity is verified at the counter with your SSS ID.<br/>
    <span style="display:inline-block;margin-top:8px;opacity:.9;">SSS-MND · <b>MabiliSSS eQueue</b></span>
  </footer>
</div>

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════
   PHASE 1 LOGIC — connection, branch status, Home render, navigation.
   Faithful port of member_app.py home behavior (status, counts, buttons).
   ════════════════════════════════════════════════════════════════════ */

var CFG = window.MABILISSS_CONFIG;
var sb = null;
var STATE = {
  branch:null, queue:[], categories:[], services:[], bqmsState:[],
  screen:"home",
  sel:{ cat:null, svc:null, timeslot:null, lane:"regular", priority:"regular" },
  ticket:null, submitting:false,
  trackedId:null, trackedEntry:null
};

/* tiny DOM helper */
function $(id){ return document.getElementById(id); }
function el(html){ var d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }

/* ── PHT time helpers (same correct idiom as the consoles) ── */
function phtNow(){ return new Date(Date.now() + 8*60*60*1000); }
function phtMinutesOfDay(){ var p=phtNow(); return p.getUTCHours()*60 + p.getUTCMinutes(); }
function phtDayKey(){ return ["sun","mon","tue","wed","thu","fri","sat"][phtNow().getUTCDay()]; }
function phtDateStr(){ var p=phtNow(); return p.getUTCFullYear()+"-"+String(p.getUTCMonth()+1).padStart(2,"0")+"-"+String(p.getUTCDate()).padStart(2,"0"); }
function nowPhtIso(){ var p=phtNow(); return p.getUTCFullYear()+"-"+String(p.getUTCMonth()+1).padStart(2,"0")+"-"+String(p.getUTCDate()).padStart(2,"0")+"T"+String(p.getUTCHours()).padStart(2,"0")+":"+String(p.getUTCMinutes()).padStart(2,"0")+":"+String(p.getUTCSeconds()).padStart(2,"0")+"+08:00"; }

function fmt12h(t){
  if(!t) return "";
  var parts=String(t).split(":"); var h=parseInt(parts[0],10); var m=parts[1]||"00";
  var ap=h>=12?"PM":"AM"; var h12=h%12; if(h12===0)h12=12;
  return h12+":"+m+" "+ap;
}

/* ── Gateway call — replaces the direct Supabase client; this file carries no DB key ── */
function gw(action, body){
  body = body || {}; body.action = action;
  var base = (CFG && CFG.SUPABASE_URL ? CFG.SUPABASE_URL : "").replace(/\/+$/, "");
  return fetch(base + "/functions/v1/pwa-gateway", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body)
  }).then(function(r){ return r.json(); });
}

/* ── Connect ── */
function connect(){
  if(!CFG || !CFG.SUPABASE_URL){
    showError("Branch configuration not found. Please check the link you used.");
    return;
  }
  try{
    // Database client removed — all data now flows through the gateway (no DB key in this file).
    $("branchName").textContent = CFG.BRANCH_NAME || "SSS Branch";
    // Show the official SSS logo immediately (embedded default); upgrade to branch logo_url after load.
    var img = $("sssLogoImg");
    if(img){ img.src = window.SSS_LOGO_DEFAULT; img.onerror = function(){ img.style.display="none"; }; }
    loadHome();
  }catch(e){
    showError("Could not connect. Please try again in a moment.");
    console.error(e);
  }
}

/* ── Load branch_config + today's queue (column-scoped reads, like the kiosk) ── */
function loadHome(){
  gw("home", { date: phtDateStr() }).then(function(res){
    if(res.error){ showError("Couldn't load branch info. Please retry."); console.error(res.error); return; }
    STATE.branch = res.branch_config || {};
    STATE.queue  = res.queue || [];
    STATE.categories = (res.categories || []).filter(function(c){ return !c.hidden; });
    STATE.services   = res.services || [];
    // If URL carries ?t=<entry_id> (from a QR or saved link), open the tracker directly.
    var urlToken = new URLSearchParams(window.location.search).get("t");
    if(urlToken){
      var match = STATE.queue.filter(function(r){ return r.id===urlToken; })[0];
      if(match){ STATE.trackedId=urlToken; renderHome(); go("tracker"); return; }
    }
    renderHome();
    startHomePoll();
  }).catch(function(e){
    showError("Network problem. Please check your connection and retry.");
    console.error(e);
  });
}

/* Refresh just the queue (for fresh cap checks before insert) */
function refreshQueue(){
  return gw("queue", { date: phtDateStr() })
    .then(function(res){ STATE.queue = (res && res.queue) ? res.queue : STATE.queue; return STATE.queue; });
}

/* Refresh branch_config + today's queue TOGETHER — keeps live status / test_mode / announcement /
   hours in sync with the staff & manager consoles. The consoles use realtime; the PWA polls, and
   until now it only polled the queue — so console status/test-mode changes never reached an open PWA. */
function refreshAll(){
  return gw("sync", { date: phtDateStr() }).then(function(res){
    if(res && res.branch_config) STATE.branch = res.branch_config;
    STATE.queue = (res && res.queue) ? res.queue : STATE.queue;
    return STATE.queue;
  });
}
var HOME_POLL=null;
function stopHomePoll(){ if(HOME_POLL){ clearInterval(HOME_POLL); HOME_POLL=null; } }
function startHomePoll(){
  stopHomePoll();
  var tick=function(){
    if(STATE.screen!=="home"){ stopHomePoll(); return; }
    refreshAll().then(function(){ if(STATE.screen==="home") renderHome(); }).catch(function(){});
  };
  HOME_POLL=setInterval(tick, pollInterval());
  tick();  // immediate refresh on entry — gives a reload-free way to pull the latest console status
}

/* ── Branch status resolver (faithful to member_app.py: holiday → working-day → hours → offline) ── */
function resolveStatus(b){
  var oStat = (b.o_stat || "online");
  // holiday?
  var holidays = (b.holidays || "");
  var isHoliday = holidays.split(",").map(function(s){return s.trim();}).indexOf(phtDateStr()) >= 0;
  // working day?
  var working = b.working_days || "mon,tue,wed,thu,fri";
  var isWorking = working.toLowerCase().indexOf(phtDayKey()) >= 0;
  // office hours for today
  var oh = {};
  try{ oh = (typeof b.office_hours_json==="string") ? JSON.parse(b.office_hours_json) : (b.office_hours_json||{}); }catch(e){ oh={}; }
  var today = oh[phtDayKey()] || null;
  var openStr  = today && today.open  ? today.open  : (b.first_appointment_time || "08:00");
  var closeStr = today && today.close ? today.close : "17:00";
  var openMin  = toMin(openStr), closeMin = toMin(closeStr);
  var nowMin   = phtMinutesOfDay();
  var withinHours = nowMin >= openMin && nowMin < closeMin;

  if(isHoliday) return {kind:"holiday", label:"Today is a holiday — the branch is closed.", open:openStr, close:closeStr, isOpen:false};
  if(!isWorking) return {kind:"closed", label:"The branch is closed today.", open:openStr, close:closeStr, isOpen:false};
  if(oStat==="offline") return {kind:"offline", label:"The branch is temporarily offline. Please try again shortly.", open:openStr, close:closeStr, isOpen:false};
  if(!withinHours) return {kind:"closed", label:"The branch is currently closed.", open:openStr, close:closeStr, isOpen:false};
  if(oStat==="intermittent") return {kind:"intermittent", label:"Service is intermittent — you can still reserve, but please expect delays.", open:openStr, close:closeStr, isOpen:true};
  return {kind:"open", label:"The branch is open and serving.", open:openStr, close:closeStr, isOpen:true};
}
function toMin(t){ var p=String(t).split(":"); return (parseInt(p[0],10)||0)*60 + (parseInt(p[1],10)||0); }

/* ── Is online reservation open right now? (faithful: reservation_open_time → online close) ── */
function reservationOpen(b, status){
  // test_mode FIRST — mirrors db.py is_reservation_open(): bypasses holiday / working-day / hours / time-window.
  if(b.test_mode===true || String(b.test_mode)==="true")
    return {open:true, msg:"TEST MODE — time restrictions bypassed", test:true};
  // R1 FIX: block ONLY genuine closure (holiday / non-working day / staff offline).
  // Outside office hours is NOT genuine closure. Online reservations open at
  // reservation_open_time (06:00), before the branch physically opens (08:00). The old
  // guard keyed on status.isOpen, which is false before 08:00, so the 06:00 window never ran.
  var holidays = (b.holidays || "");
  var isHoliday = holidays.split(",").map(function(s){return s.trim();}).indexOf(phtDateStr()) >= 0;
  var working = b.working_days || "mon,tue,wed,thu,fri";
  var isWorking = working.toLowerCase().indexOf(phtDayKey()) >= 0;
  var oStat = (b.o_stat || "online");
  if(isHoliday)         return {open:false, closed:true, msg:"Today is a holiday. Reservations are closed."};
  if(!isWorking)        return {open:false, closed:true, msg:"The branch is closed today."};
  if(oStat==="offline") return {open:false, closed:true, msg:"The branch is temporarily offline. Please try again shortly."};
  var resOpen = toMin(b.reservation_open_time || "06:00");
  var closeBefore = parseInt(b.online_close_before_hours || 1, 10);
  var onlineClose = toMin(status.close) - closeBefore*60;
  var nowMin = phtMinutesOfDay();
  if(nowMin < resOpen)  return {open:false, closed:false, msg:"Online reservations open at "+fmt12h(b.reservation_open_time||"06:00")+"."};
  if(nowMin >= onlineClose) return {open:false, closed:false, msg:"Online reservations for today have closed."};
  return {open:true, msg:""};
}

/* ════════════════════ HOME RENDER ════════════════════ */
function renderHome(){
  var b = STATE.branch;
  // Upgrade app-bar logo to the branch's own logo_url if configured (else keep embedded default).
  var logoImg = $("sssLogoImg");
  if(logoImg && b.logo_url && String(b.logo_url).trim()){
    logoImg.onerror = function(){ logoImg.onerror = function(){ logoImg.style.display="none"; }; logoImg.src = window.SSS_LOGO_DEFAULT; };
    logoImg.src = String(b.logo_url).trim();
  }
  var status = resolveStatus(b);
  var resv = reservationOpen(b, status);
  var canReserve = (status.kind!=="offline") && resv.open;  // test_mode (via resv.open) bypasses closed/holiday/hours; offline still blocks, like member_app
  var active = getActiveReservation();

  var waiting = STATE.queue.filter(function(r){ return r.status==="RESERVED"||r.status==="ARRIVED"; }).length;
  var serving = STATE.queue.filter(function(r){ return r.status==="SERVING"; }).length;

  var ann = (b.announcement||"").trim();

  var html = ""
  + statusBannerHtml(status)
  + hoursLineHtml(status)
  + (ann ? '<div class="announce">📢 '+escapeHtml(ann)+'</div>' : "")
  + '<div class="counts">'
  +   '<div class="count"><div class="val" style="color:'+(waiting>0?"var(--warn-d)":"var(--ok-d)")+'">📋 '+waiting+'</div><div class="lbl">In Queue</div></div>'
  +   '<div class="count"><div class="val" style="color:'+(serving>0?"var(--sss-blue-l)":"var(--text-muted)")+'">🔵 '+serving+'</div><div class="lbl">Being Served</div></div>'
  + '</div>'
  + (resv.test ? '<div class="note note-blue">🧪 '+escapeHtml(resv.msg)+'</div>' : "")
  + (!resv.open && !resv.test && !resv.closed ? '<div class="note note-yellow">⏰ '+escapeHtml(resv.msg)+'</div>' : "")

/* ════════════════════ PHASE 2 — RESERVATION HELPERS ════════════════════ */

/* Unique id (mirrors db.py gen_id: microsecond ts + 8 hex) */
function genId(){
  return String(Date.now())+"000-"+Math.random().toString(16).slice(2,10);
}
/* YYMMDD in PHT (for res_num) */
function phtYYMMDD(){ var p=phtNow(); return String(p.getUTCFullYear()).slice(2)+String(p.getUTCMonth()+1).padStart(2,"0")+String(p.getUTCDate()).padStart(2,"0"); }
/* Next slot number = max existing slot + 1 (handles gaps) */
function nextSlotNum(){
  var max=0;
  STATE.queue.forEach(function(r){ var s=parseInt(r.slot,10); if(!isNaN(s)&&s>max)max=s; });
  return max+1;
}
/* Reservation number: R + YYMMDD + 3-digit slot */
function makeResNum(slot){ return "R"+phtYYMMDD()+String(slot).padStart(3,"0"); }

/* Count today's NON-terminal entries for a category (used vs cap). Mirrors count_daily_by_category. */
var TERMINAL = ["COMPLETED","CANCELLED","VOID","EXPIRED"];

/* ── Single active reservation lock (mirrors member_app.py: ONE active reservation per device) ──
   Persisted in localStorage, scoped per-branch. Auto-cleared when the reservation reaches a
   terminal state or is from a past day, so the member can book again. Zero-PII: stores only
   queue tokens (res_num, id, queue_date). Degrades gracefully if storage is unavailable. */
var ACTIVE_RES_KEY = "mabilisss_active_res_" + (CFG && CFG.BRANCH_CODE ? CFG.BRANCH_CODE : "DEFAULT");
function saveActiveRes(entry){ try{ localStorage.setItem(ACTIVE_RES_KEY, JSON.stringify({ res_num:entry.res_num, id:entry.id, queue_date:entry.queue_date, cancel_token:entry.cancel_token||null })); }catch(e){} }
function clearActiveRes(){ try{ localStorage.removeItem(ACTIVE_RES_KEY); }catch(e){} }
function loadActiveRes(){ try{ return JSON.parse(localStorage.getItem(ACTIVE_RES_KEY)||"null"); }catch(e){ return null; } }
function getActiveReservation(){
  var saved=loadActiveRes(); if(!saved) return null;
  if(saved.queue_date && saved.queue_date!==phtDateStr()){ clearActiveRes(); return null; }        // stale: past day
  var e=STATE.queue.filter(function(r){ return r.id===saved.id; })[0];
  if(e){ if(TERMINAL.indexOf(e.status)>=0){ clearActiveRes(); return null; } return e; }            // live status known
  return { id:saved.id, res_num:saved.res_num, status:"RESERVED", queue_date:saved.queue_date, _synthetic:true }; // booked, feed not yet refreshed
}
function countForCategory(catId, lane){
  return STATE.queue.filter(function(r){
    if(r.category_id!==catId) return false;
    if(TERMINAL.indexOf(r.status)>=0) return false;
    if(lane && (r.lane||"regular")!==lane) return false;
    return true;
  }).length;
}
/* Remaining capacity for a category (and lane if priority enabled). */
function remainingFor(cat, lane){
  var cap = parseInt(cat.cap,10); if(isNaN(cap)) cap=50;
  if(cat.priority_lane_enabled && lane){
    var laneCap = lane==="priority"
      ? (parseInt(cat.priority_cap,10) || 0)
      : (cap - (parseInt(cat.priority_cap,10) || 0));
    var used = countForCategory(cat.id, lane);
    return Math.max(0, laneCap - used);
  }
  return Math.max(0, cap - countForCategory(cat.id, null));
}
/* Online ceiling: when time slots on, online reservations capped at walk_in_floor leaves a ceiling.
   Faithful-simplified: online ceiling = cap * (1 - walk_in_floor_pct/100), floor reserved for walk-in. */
function onlineRemaining(cat){
  var cap = parseInt(cat.cap,10); if(isNaN(cap)) cap=50;
  var floorPct = parseInt(STATE.branch.walk_in_floor_pct,10); if(isNaN(floorPct)) floorPct=0;
  var ceiling = Math.floor(cap * (1 - floorPct/100));
  var onlineUsed = STATE.queue.filter(function(r){
    return r.category_id===cat.id && (r.source==="ONLINE"||r.source==="APPT") && TERMINAL.indexOf(r.status)<0;
  }).length;
  return Math.max(0, ceiling - onlineUsed);
}

/* Per-window remaining for a category, carved from the online ceiling with
   forward-flow: each window's share = ceiling / N (remainder to earliest),
   and unused slots from ENDED windows flow forward to still-open ones.
   Counts ONLINE + APPT demand per window (walk-ins draw from the floor, not here).
   Returns { "HH:MM": remaining }; ended windows return 0. */
function windowSlotInfo(cat){
  var slots = buildTimeSlots() || []; var N = slots.length; if(N===0) return {};
  var cap = parseInt(cat.cap,10); if(isNaN(cap)) cap=50;
  var floorPct = parseInt(STATE.branch.walk_in_floor_pct,10); if(isNaN(floorPct)) floorPct=0;
  var ceiling = Math.floor(cap * (1 - floorPct/100));
  function usedIn(win){
    return STATE.queue.filter(function(r){
      return r.category_id===cat.id && (r.source==="ONLINE"||r.source==="APPT")
          && TERMINAL.indexOf(r.status)<0 && r.preferred_time_slot===win;
    }).length;
  }
  var base = Math.floor(ceiling / N), rem = ceiling - base*N;
  var alloc = {}, carry = 0;
  slots.forEach(function(s, i){
    var a = base + (i < rem ? 1 : 0); alloc[s.window] = a;
    if(s.ended) carry += Math.max(0, a - usedIn(s.window));
  });
  var open = slots.filter(function(s){ return !s.ended; }), M = open.length;
  if(M>0 && carry>0){
    var add = Math.floor(carry / M), addRem = carry - add*M;
    open.forEach(function(s, i){ alloc[s.window] += add + (i < addRem ? 1 : 0); });
  }
  var out = {};
  slots.forEach(function(s){ out[s.window] = s.ended ? 0 : Math.max(0, alloc[s.window] - usedIn(s.window)); });
  return out;
}

/* Services for a category */
function servicesFor(catId){ return STATE.services.filter(function(s){ return s.category_id===catId; }); }

/* Build bookable time-slot windows from branch config (first/last appt + interval). */
function buildTimeSlots(){
  var b=STATE.branch;
  if(!(b.time_slot_enabled===true||String(b.time_slot_enabled)==="true")) return null; // slots off
  var first=toMin(b.first_appointment_time||"08:00");
  var last =toMin(b.last_appointment_time||"16:00");
  var step =parseInt(b.slot_interval_minutes,10)||60;
  var test =(b.test_mode===true||String(b.test_mode)==="true");
  var nowMin=phtMinutesOfDay();
  var slots=[];
  for(var m=first;m<=last;m+=step){
    var endM=Math.min(m+step,last+step);
    var ended = !test && (nowMin>=endM);
    slots.push({ window:minToHHMM(m), windowEnd:minToHHMM(endM), startMin:m, ended:ended });
  }
  return slots;
}
function minToHHMM(m){ return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
/* Render a stored slot START ("08:00") as the full window "8:00 AM – 9:00 AM" using the branch slot interval. */
function fmtSlotWindow(hhmm){
  if(!hhmm) return "";
  var step = parseInt(STATE.branch && STATE.branch.slot_interval_minutes,10)||60;
  return fmt12h(hhmm)+" – "+fmt12h(minToHHMM(toMin(hhmm)+step));
}

}

            + '</button>';

/* ── The reservation insert (engine-compatible, zero-PII) ── */
function submitReservation(){
  if(STATE.submitting) return;
  var c=STATE.sel.cat; if(!c){ go("select_cat"); return; }
  var msg=$("confirmMsg");
  var setMsg=function(t,k){ if(msg){ msg.textContent=t; msg.className="pwa-msg "+(k||""); } };

  if(getActiveReservation()){ setMsg("⚠ You already have an active reservation. Go to Home to view or cancel it before booking another.","err"); return; }

  var lane="regular", priority="regular";
  if(c.priority_lane_enabled){
    var picked=document.querySelector('input[name="lane"]:checked');
    if(picked && picked.value==="priority"){
      var consent=$("priConsent");
      if(!consent || !consent.checked){ setMsg("⚠ Please confirm your priority qualification to continue.","err"); return; }
      lane="priority"; priority="priority";
    }
  }

  STATE.submitting=true;
  var btn=$("btnConfirm"); var orig=btn.innerHTML; btn.disabled=true; btn.innerHTML="<span>⏳ Reserving…</span>";

  refreshQueue().then(function(){
    var rem = c.priority_lane_enabled ? remainingFor(c,lane) : remainingFor(c,null);
    var slotsOn=(STATE.branch.time_slot_enabled===true||String(STATE.branch.time_slot_enabled)==="true");
    if(slotsOn){ var onl=onlineRemaining(c); if(onl<rem) rem=onl; }
    if(slotsOn && STATE.sel.timeslot){
      var wr=windowSlotInfo(c)[STATE.sel.timeslot];
      if(typeof wr==="number" && wr<=0){
        STATE.submitting=false; btn.disabled=false; btn.innerHTML=orig;
        setMsg("\u26a0 Sorry, your selected time window just filled up. Please go back and choose another window.","err");
        return;
      }
      if(typeof wr==="number" && wr<rem) rem=wr;
    }
    if(rem<=0){
      STATE.submitting=false; btn.disabled=false; btn.innerHTML=orig;
      setMsg("⚠ Sorry, the last slot for this transaction was just taken. Please try another transaction or the next working day.","err");
      return;
    }
    var slot=nextSlotNum();
    var ts=nowPhtIso();
    var entry={
      id:genId(),
      queue_date:phtDateStr(),
      res_num:makeResNum(slot),
      slot:slot,
      category_id:c.id,
      category:(c.label||c.id),
      cat_icon:(c.icon||""),
      service_id:(STATE.sel.svc?STATE.sel.svc.id:"walkin"),
      priority:priority,
      lane:lane,
      status:"RESERVED",
      bqms_number:null,
      source:"ONLINE",
      issued_at:ts
    };
    if(slotsOn && STATE.sel.timeslot){ entry.preferred_time_slot=STATE.sel.timeslot; }

    gw("book", { entry: entry }).then(function(r){
      if(r.error){
        STATE.submitting=false; btn.disabled=false; btn.innerHTML=orig;
        setMsg("⚠ Could not create your reservation: "+(r.error.message||"please retry."),"err");
        console.error(r.error); return;
      }
      if(r.data && r.data.cancel_token) entry.cancel_token = r.data.cancel_token;
      saveActiveRes(entry);
      STATE.ticket={ res_num:entry.res_num, id:entry.id, category:(c.label||c.id), service:(STATE.sel.svc?STATE.sel.svc.label:""), lane:lane, timeslot:(entry.preferred_time_slot||null), bqms:null };
      STATE.submitting=false;
      go("ticket");
    }).catch(function(e){
      STATE.submitting=false; btn.disabled=false; btn.innerHTML=orig;
      setMsg("⚠ Network problem creating your reservation. Please retry.","err");
      console.error(e);
    });
  }).catch(function(e){
    STATE.submitting=false; btn.disabled=false; btn.innerHTML=orig;
    setMsg("⚠ Network problem. Please retry.","err"); console.error(e);
  });
}

    + (t.timeslot?'<div class="note note-yellow">⏰ Please be at the branch during your time window so you don\'t miss your turn. Arriving early? Check in at the kiosk to get your queue number.</div>':"")
    + '<div class="card how">'
    +   '<div class="how-title">What happens next</div>'
    +   '<div class="how-step"><div class="how-num">1</div><div>Your number is <b>'+escapeHtml(t.res_num)+'</b>. Keep it safe.</div></div>'
    +   '<div class="how-step"><div class="how-num">2</div><div>When the branch opens, you\'ll get your official BQMS number automatically.</div></div>'
    +   '<div class="how-step"><div class="how-num">3</div><div>Tap <b>Track My Number</b> to watch your place in line.</div></div>'
    +   '<div class="how-step"><div class="how-num">4</div><div>Bring your <b>SSS ID</b> to the counter.</div></div>'
    + '</div>'
    + '<button class="btn btn-primary" id="tkTrack"><span>🔍 Track My Number</span></button>'
    + '<button class="btn btn-secondary" id="tkHome"><span>🏠 Back to Home</span></button>';
  $("screen").innerHTML=html;
  $("tkTrack").addEventListener("click", function(){ go("track_input"); });
  $("tkHome").addEventListener("click", function(){ STATE.sel={cat:null,svc:null,timeslot:null,lane:"regular",priority:"regular"}; loadHome(); });
}

/* ════════════════════ PHASE 3 — TRACK FLOW (polling, NOT realtime) ════════════════════ */

var POLL = { timer:null, entryId:null };
function stopPoll(){ if(POLL.timer){ clearInterval(POLL.timer); POLL.timer=null; } POLL.entryId=null; }
function pollInterval(){
  var s=parseInt(STATE.branch.member_refresh_seconds,10);
  if(isNaN(s)||s<15) s=30; if(s>120) s=120;
  return s*1000;
}

/* ── Screen: Track Input (search by BQMS or reservation number) ── */
function renderTrackInput(){
  var html = flowHeader("Track your number","home");
  html += '<div class="card">'
        +   '<div class="track-tabs">'
        +     '<button class="track-tab active" data-mode="bqms">🎫 BQMS Number</button>'
        +     '<button class="track-tab" data-mode="res">#️⃣ Reservation No.</button>'
        +   '</div>'
        +   '<input type="text" class="track-input" id="trackVal" inputmode="text" autocomplete="off" placeholder="Enter your BQMS number (e.g. 1001)" />'
        +   '<div class="pwa-msg" id="trackMsg"></div>'
        +   '<button class="btn btn-primary" id="btnTrackGo"><span>🔍 Track</span></button>'
        + '</div>'
        + '<div class="note note-blue">💡 <b>BQMS</b> = the queue number assigned at the branch. <b>Reservation No.</b> starts with <b>R</b> (online) or <b>K</b> (kiosk), e.g. R260611005.</div>';
  $("screen").innerHTML = html; wireBack();

  var mode="bqms";
  Array.prototype.forEach.call(document.querySelectorAll(".track-tab"), function(tab){
    tab.addEventListener("click", function(){
      mode=tab.getAttribute("data-mode");
      Array.prototype.forEach.call(document.querySelectorAll(".track-tab"), function(t){ t.classList.remove("active"); });
      tab.classList.add("active");
      $("trackVal").placeholder = mode==="bqms" ? "Enter your BQMS number (e.g. 1001)" : "Enter your Reservation No. (e.g. R260611005)";
      $("trackVal").value="";
    });
  });
  var doTrack=function(){ trackLookup(mode, ($("trackVal").value||"").trim()); };
  $("btnTrackGo").addEventListener("click", doTrack);
  $("trackVal").addEventListener("keydown", function(e){ if(e.key==="Enter") doTrack(); });
}

/* ── Lookup: find the entry by BQMS or res_num, then open tracker ── */
function trackLookup(mode, val){
  var msg=$("trackMsg");
  var setMsg=function(t,k){ if(msg){ msg.textContent=t; msg.className="pwa-msg "+(k||""); } };
  if(!val){ setMsg("⚠ Please enter your number first.","err"); return; }
  var vu=val.toUpperCase();
  setMsg("Searching…","");

  // refresh today's queue, then search
  refreshQueue().then(function(){
    var found=null;
    if(mode==="bqms"){
      // prefer active entry with that bqms; fall back to any
      found = STATE.queue.filter(function(r){ return String(r.bqms_number||"").toUpperCase()===vu && TERMINAL.indexOf(r.status)<0; })[0]
           || STATE.queue.filter(function(r){ return String(r.bqms_number||"").toUpperCase()===vu; })[0];
    } else {
      found = STATE.queue.filter(function(r){ return String(r.res_num||"").toUpperCase()===vu && TERMINAL.indexOf(r.status)<0; })[0]
           || STATE.queue.filter(function(r){ return String(r.res_num||"").toUpperCase()===vu; })[0];
    }
    if(found){ STATE.trackedId=found.id; go("tracker"); return; }
    // cross-date lookup for reservation numbers (future appointments) — direct query
    if(mode==="res"){
      gw("track", { res_num: vu })
        .then(function(r){
          var rows=(r&&r.rows)?r.rows:[];
          var pick = rows.filter(function(x){ return TERMINAL.indexOf(x.status)<0; })[0] || rows[0];
          if(pick){ STATE.trackedEntry=pick; STATE.trackedId=pick.id; go("tracker"); }
          else { setMsg("⚠ No reservation found with that number. Please check and try again.","err"); }
        }).catch(function(){ setMsg("⚠ Could not search. Please retry.","err"); });
    } else {
      setMsg("⚠ No active entry found with that BQMS number today. Please check and try again.","err");
    }
  }).catch(function(){ setMsg("⚠ Network problem. Please retry.","err"); });
}

/* ── Position: active entries, same category+lane, lower BQMS# (mirrors count_ahead) ── */
function countAhead(entry){
  var myBqms=entry.bqms_number; if(!myBqms) return null;
  var myNum=parseInt(String(myBqms).replace(/\D/g,""),10);
  if(isNaN(myNum)) return null;
  var myCat=entry.category_id, myLane=entry.lane||"regular";
  // Only entries that already HAVE a BQMS number in my exact category and lane compete with me.
  // A reservation with no number yet is not in the live line, so it is not counted.
  var numbered=STATE.queue.filter(function(r){
    return r.category_id===myCat && (r.lane||"regular")===myLane && r.bqms_number;
  });
  // Now-serving anchor: the furthest number staff have reached in this lane (max BQMS among
  // SERVING, PASSED, COMPLETED). Anything at or below this point is already behind the counter,
  // so a skipped no-show still flagged ARRIVED must not be counted as ahead.
  var nowServing=0;
  numbered.forEach(function(r){
    if(r.status==="SERVING"||r.status==="PASSED"||r.status==="COMPLETED"){
      var n=parseInt(String(r.bqms_number).replace(/\D/g,""),10);
      if(!isNaN(n) && n>nowServing) nowServing=n;
    }
  });
  // Ahead = numbered entries still actively waiting (not served, serving, passed, parked, or
  // terminal), strictly between the now-serving point and my own number.
  return numbered.filter(function(r){
    if(TERMINAL.indexOf(r.status)>=0) return false;
    if(r.status==="SERVING"||r.status==="PASSED"||r.status==="PARKED") return false;
    var n=parseInt(String(r.bqms_number).replace(/\D/g,""),10);
    return !isNaN(n) && n>nowServing && n<myNum;
  }).length;
}

/* ── Find the current tracked entry (fresh) ── */
function findTracked(){
  if(STATE.trackedId){
    var e=STATE.queue.filter(function(r){ return r.id===STATE.trackedId; })[0];
    if(e) return e;
  }
  return STATE.trackedEntry || null;
}

/* ── Screen: Tracker (polls every member_refresh_seconds) ── */
function renderTracker(){
  // initial fetch then render + start poll
  refreshQueue().then(function(){
    renderTrackerView();
    stopPoll();
    POLL.entryId=STATE.trackedId;
    POLL.timer=setInterval(function(){
      refreshQueue().then(function(){ if(STATE.screen==="tracker") renderTrackerView(); });
    }, pollInterval());
  });
  // show a loading frame immediately
  $("screen").innerHTML='<div class="loading"><div class="spinner"></div><div>Loading your status…</div></div>';
}

function renderTrackerView(){
  var t=findTracked();
  if(!t){
    $("screen").innerHTML='<button class="btn btn-secondary flow-back" data-back="track_input" style="margin-bottom:14px"><span>← Try Again</span></button>'
      +'<div class="card" style="text-align:center;color:var(--text-muted)">We couldn\'t find that entry anymore. It may have been completed or cancelled.</div>';
    wireBack(); return;
  }
  var status=t.status||"";
  var hasBqms=!!t.bqms_number;
  var isTerminal=TERMINAL.indexOf(status)>=0;
  var ahead = (hasBqms && !isTerminal) ? countAhead(t) : null;

  // R2: pre-open detection. Working, non-holiday day, before office open time.
  var _pb = STATE.branch || {}, _pst = resolveStatus(_pb);
  var _phol = (_pb.holidays||"").split(",").map(function(s){return s.trim();}).indexOf(phtDateStr()) >= 0;
  var _pwrk = (_pb.working_days||"mon,tue,wed,thu,fri").toLowerCase().indexOf(phtDayKey()) >= 0;
  var preOpen = _pwrk && !_phol && (phtMinutesOfDay() < toMin(_pst.open||"08:00"));

  // status banner
  var banner="";
  if(status==="SERVING"){
    banner='<div class="tk-banner srv">🔵 NOW SERVING<br><b>PROCEED TO THE COUNTER</b><div class="tk-banner-sub">Staff is calling your number — please go now.</div></div>';
  } else if(status==="PASSED"){
    banner='<div class="tk-banner passed">⏭️ YOU WERE PASSED<br><b>RETURN TO THE COUNTER</b><div class="tk-banner-sub">Your number was called but you weren\'t at the counter. Please return now.</div></div>';
  } else if(status==="COMPLETED"){
    banner='<div class="tk-banner done">✅ <b>Transaction Completed</b><div class="tk-banner-sub">Thank you for visiting SSS!</div></div>';
  } else if(status==="CANCELLED"){
    banner='<div class="tk-banner cancel">🚫 <b>Reservation Cancelled</b><div class="tk-banner-sub">Your slot has been released.</div></div>';
  } else if(status==="EXPIRED"){
    banner='<div class="tk-banner cancel">⏰ <b>Slot Expired</b><div class="tk-banner-sub">Please reserve a new slot or visit as a walk-in, subject to available slots.</div></div>';
  } else if(status==="VOID"){
    banner='<div class="tk-banner cancel">🚫 <b>Reservation Voided</b><div class="tk-banner-sub">Please contact branch staff if you have questions.</div></div>';
  } else if(status==="PARKED"){
    if(t.member_ready_at){
      var _rdyCtr = t.parked_by_counter ? escapeHtml(String(t.parked_by_counter)) : "your counter";
      banner='<div class="tk-banner passed">✅ <b>You\'re all set</b><div class="tk-banner-sub">The staff has been notified and will call your number again shortly. Please keep this screen open and watch for your number, then proceed to '+_rdyCtr+'.</div></div>';
    } else {
      banner='<div class="tk-banner passed">⏸️ ON HOLD<div class="tk-banner-sub">The staff set your transaction aside while you prepare your documents or forms. When you have everything ready, tap the button below and the staff will call you to continue. Your number stays the same.</div></div>';
    }
  }

  // R2: pre-open banner for a number held before the branch opens (no terminal/serving/passed banner set).
  if(!banner && preOpen && !isTerminal && status!=="SERVING" && status!=="PASSED"){
    banner='<div class="tk-banner passed">🕗 BRANCH NOT YET OPEN<br><b>SERVING BEGINS AT '+fmt12h(_pst.open||"08:00")+'</b><div class="tk-banner-sub">Your number is held. Please be at the branch when serving starts.</div></div>';
  }

  var numDisplay = hasBqms ? t.bqms_number : (t.res_num||"—");
  var numLabel = hasBqms ? "Your BQMS number" : "Your reservation number";

  var aheadDisplay, aheadColor;
  if(status==="SERVING"){ aheadDisplay="IT'S YOUR TURN!"; aheadColor="var(--ok-d)"; }
  else if(status==="PASSED"){ aheadDisplay="PASSED"; aheadColor="var(--err)"; }
  else if(status==="PARKED"){ aheadDisplay="ON HOLD"; aheadColor="var(--warn-d)"; }
  else if(ahead===null){ aheadDisplay = hasBqms?"—":"Waiting for branch to open"; aheadColor="var(--text-muted)"; }
  else if(ahead===0){ aheadDisplay="You're Next!"; aheadColor="var(--ok-d)"; }
  else { aheadDisplay=String(ahead); aheadColor="var(--warn-d)"; }

  var html='<button class="btn btn-secondary flow-back" data-back="track_input" style="margin-bottom:14px;padding:11px"><span>← Track another</span></button>';
  html += banner;
  html += '<div class="tk-card">'
        +   '<div class="tk-num">'+escapeHtml(String(numDisplay))+'</div>'
        +   '<div class="tk-num-label">'+numLabel+'</div>';
  if(!isTerminal){
    html += '<div class="tk-ahead"><div class="tk-ahead-val" style="color:'+aheadColor+'">'+aheadDisplay+'</div><div class="tk-ahead-lbl">'+(status==="SERVING"||status==="PASSED"||status==="PARKED"?"Status":"Ahead of you")+'</div></div>';
  }
  if(t.preferred_time_slot){ html += '<div class="tk-slot">🕐 Time window: <b>'+fmtSlotWindow(t.preferred_time_slot)+'</b></div>'; }
  if(t.preferred_time_slot && status==="RESERVED"){ html += '<div class="note note-yellow" style="margin-top:8px">⏰ Please be at the branch during your time window so you don\'t miss your turn. Arriving early? Check in at the kiosk to get your queue number.</div>'; }
  html += '</div>';

  // estimate (rough) when waiting with people ahead
  if(!isTerminal && ahead!==null && ahead>0 && status!=="PASSED" && status!=="SERVING" && status!=="PARKED"){
    if(preOpen){
      html += '<div class="note note-blue">⏱ Time estimates begin once serving starts at '+fmt12h(_pst.open||"08:00")+'.</div>';
    } else {
      var avg=parseInt((STATE.sel.cat&&STATE.sel.cat.avg_time),10); if(isNaN(avg)||avg<=0) avg=8;
      var lo=Math.round(ahead*avg*0.75), hi=Math.round(ahead*avg*1.35);
      html += '<div class="note note-blue">⏱ Rough estimate: about <b>'+lo+'–'+hi+' min</b> based on average service speed. Actual wait may vary.</div>';
    }
  }
  if(!isTerminal && ahead!==null && ahead<=3 && ahead>0 && status!=="PARKED" && status!=="SERVING"){
    html += '<div class="note note-yellow">⚠️ Your number is approaching — only <b>'+ahead+'</b> ahead. Please proceed to the waiting area.</div>';
  }

  // actions
  html += '<div class="pwa-msg" id="trackerMsg"></div>';
  // Owner-only cancel: only the device that created this reservation via the PWA may cancel it.
  var _owned = (function(){ var av=loadActiveRes(); return !!(av && av.id===t.id); })();
  if((status==="RESERVED"||status==="ARRIVED") && _owned){
    html += '<button class="btn btn-secondary" id="btnCancel"><span>🚫 Cancel My Reservation</span></button>';
  }
  if(status==="PARKED" && _owned && !t.member_ready_at){
    html += '<button class="btn btn-primary" id="btnReady"><span>🙋 I\'m back and ready</span></button>';
  }
  if(status==="COMPLETED"){
    html += '<div id="csatMount"></div>';
  }
  html += '<button class="btn btn-secondary" id="btnRefresh"><span>🔄 Refresh Now</span></button>';
  html += '<div class="tk-autonote">Auto-updates every '+(pollInterval()/1000)+'s</div>';

  $("screen").innerHTML=html; wireBack();
  var rf=$("btnRefresh"); if(rf) rf.addEventListener("click", function(){ refreshQueue().then(renderTrackerView); });
  var cx=$("btnCancel"); if(cx) cx.addEventListener("click", function(){ cancelReservation(t); });
  var rb=$("btnReady"); if(rb) rb.addEventListener("click", function(){ markReady(t); });
  if(status==="COMPLETED"){ mountCsat(t); }
}

/* ── Cancel reservation (member self-cancel) ── */
function cancelReservation(t){
  if(!confirm("Cancel your reservation? Your slot will be released and you'll need to reserve again.")) return;
  var msg=$("trackerMsg"); var setMsg=function(x,k){ if(msg){ msg.textContent=x; msg.className="pwa-msg "+(k||""); } };
  setMsg("Cancelling…","");
  gw("cancel", { id: t.id, status: t.status, token: (loadActiveRes()||{}).cancel_token || null })
    .then(function(r){
      if(r.error){ setMsg("⚠ Could not cancel: "+(r.error.message||"retry."),"err"); return; }
      var av=loadActiveRes(); if(av && av.id===t.id){ clearActiveRes(); }
      refreshQueue().then(renderTrackerView);
    }).catch(function(){ setMsg("⚠ Network problem. Please retry.","err"); });
}

/* ── Member taps "I'm back and ready" (PARKED): notify staff, keep the same number ── */
function markReady(t){
  var msg=$("trackerMsg"); var setMsg=function(x,k){ if(msg){ msg.textContent=x; msg.className="pwa-msg "+(k||""); } };
  setMsg("Letting the staff know…","");
  gw("ready", { id: t.id, status: t.status, token: (loadActiveRes()||{}).cancel_token || null })
    .then(function(r){
      if(r.error){ setMsg("⚠ Could not notify staff: "+(r.error.message||"please try again."),"err"); return; }
      setMsg("✅ The staff has been notified.","");
      refreshQueue().then(renderTrackerView);
    }).catch(function(){ setMsg("⚠ Network problem. Please retry.","err"); });
}

/* ── CSAT (shown on COMPLETED) — q1 quality, q2 wait feel, q3 factor, optional comment ── */
function mountCsat(t){
  var mount=$("csatMount"); if(!mount) return;
  // already submitted?
  gw("csat_check", { queue_entry_id: t.id }).then(function(r){
    if(r&&r.exists){ mount.innerHTML='<div class="note note-blue">🙏 Thank you for your feedback! It helps us serve you better.</div>'; return; }
    renderCsatForm(t, mount);
  }).catch(function(){ renderCsatForm(t, mount); });
}
function renderCsatForm(t, mount){
  var q1emojis=["😞","😟","😐","🙂","😀"];
  var q2labels=["Way too long","Too long","Acceptable","Reasonable","Very fast"];
  var q3opts=[["staff","Friendly staff"],["fast","Fast service"],["clear","Clear instructions"],["queue","Smooth queue"],["other","Other"]];
  var html='<div class="card csat">'
    +'<div class="csat-title">How was your visit?</div>'
    +'<div class="csat-q">Overall service quality</div><div class="csat-row" id="csatQ1">';
  q1emojis.forEach(function(e,i){ html+='<button class="csat-opt" data-q1="'+(i+1)+'"><span class="csat-emo">'+e+'</span></button>'; });
  html+='</div>';
  html+='<div class="csat-q">How did the wait feel?</div><div class="csat-row csat-row-wrap" id="csatQ2">';
  q2labels.forEach(function(l,i){ html+='<button class="csat-opt csat-opt-text" data-q2="'+(i+1)+'">'+l+'</button>'; });
  html+='</div>';
  html+='<div class="csat-q">What stood out? (optional)</div><div class="csat-row csat-row-wrap" id="csatQ3">';
  q3opts.forEach(function(o){ html+='<button class="csat-opt csat-opt-text" data-q3="'+o[0]+'">'+o[1]+'</button>'; });
  html+='</div>';
  html+='<textarea class="csat-comment" id="csatComment" maxlength="500" placeholder="Tell us more (optional)…"></textarea>';
  html+='<div class="pwa-msg" id="csatMsg"></div>';
  html+='<button class="btn btn-primary" id="csatSubmit"><span>✅ Submit Feedback</span></button>';
  html+='<button class="btn btn-secondary" id="csatSkip" style="margin-top:8px"><span>Skip</span></button>';
  html+='</div>';
  mount.innerHTML=html;

  var sel={q1:null,q2:null,q3:null};
  var wire=function(group,key){
    Array.prototype.forEach.call(document.querySelectorAll('#'+group+' .csat-opt'), function(b){
      b.addEventListener("click", function(){
        Array.prototype.forEach.call(document.querySelectorAll('#'+group+' .csat-opt'), function(x){ x.classList.remove("sel"); });
        b.classList.add("sel"); sel[key]=b.getAttribute("data-"+key);
      });
    });
  };
  wire("csatQ1","q1"); wire("csatQ2","q2"); wire("csatQ3","q3");
  $("csatSkip").addEventListener("click", function(){ mount.innerHTML='<div class="note note-blue">No problem — thanks for visiting SSS!</div>'; });
  $("csatSubmit").addEventListener("click", function(){
    var msg=$("csatMsg"); var setMsg=function(x,k){ if(msg){ msg.textContent=x; msg.className="pwa-msg "+(k||""); } };
    if(!sel.q1){ setMsg("⚠ Please rate the overall service quality.","err"); return; }
    if(!sel.q2){ setMsg("⚠ Please tell us how the wait felt.","err"); return; }
    var payload={
      id:genId(),
      queue_entry_id:t.id,
      queue_date:(t.queue_date||phtDateStr()),
      bqms_number:(t.bqms_number||""),
      category_id:(t.category_id||""),
      q1_service_quality:parseInt(sel.q1,10),
      q2_wait_feel:parseInt(sel.q2,10),
      q3_fvr_factors:(sel.q3?[sel.q3]:[]),
      q4_loyalty:null,
      submitted_at:nowPhtIso()
    };
    var cmt=($("csatComment").value||"").trim(); if(cmt) payload.comment=cmt;
    var btn=$("csatSubmit"); btn.disabled=true; btn.innerHTML="<span>⏳ Submitting…</span>";
    gw("csat_submit", { payload: payload }).then(function(r){
      if(r.error){ btn.disabled=false; btn.innerHTML="<span>✅ Submit Feedback</span>"; setMsg("⚠ Could not submit: "+(r.error.message||"retry."),"err"); return; }
      mount.innerHTML='<div class="note note-blue">🙏 Thank you for your feedback! It helps us serve you better.</div>';
    }).catch(function(){ btn.disabled=false; btn.innerHTML="<span>✅ Submit Feedback</span>"; setMsg("⚠ Network problem. Please retry.","err"); });
  });
}

/* ── Error + util ── */
function showError(msg){
  $("screen").innerHTML = '<div class="errbox">⚠️ '+escapeHtml(msg)+'<br><br>'
    + '<button class="btn btn-secondary" onclick="location.reload()" style="margin-top:8px"><span>↻ Retry</span></button></div>';
}
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}

document.addEventListener("DOMContentLoaded", connect);
